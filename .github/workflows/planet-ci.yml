name: Conduit Planet CI

on:
  push:
    branches:
      - planet-seamless-surface
    paths:
      - 'packages/conduit-planet/**'
      - 'packages/conduit-web3d/**'
      - 'src/game/rendering/**'
      - 'src/game/dev/scenes/planets/**'
      - 'src/game/simulation/**'
      - 'tests/SimulationClock.test.ts'
      - 'tests/PlanetSeasonCycle.test.ts'
      - 'scripts/build.ts'
      - 'index.html'
      - 'package.json'
      - 'bun.lock'
      - 'tsconfig.json'
      - '.github/workflows/planet-ci.yml'
  pull_request:
    paths:
      - 'packages/conduit-planet/**'
      - 'packages/conduit-web3d/**'
      - 'src/game/rendering/**'
      - 'src/game/dev/scenes/planets/**'
      - 'src/game/simulation/**'
      - 'tests/SimulationClock.test.ts'
      - 'tests/PlanetSeasonCycle.test.ts'
      - 'scripts/build.ts'
      - 'index.html'
      - 'package.json'
      - 'bun.lock'
      - 'tsconfig.json'
      - '.github/workflows/planet-ci.yml'

permissions:
  contents: read

concurrency:
  group: conduit-planet-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Test, build and inspect types
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Keep CI deterministic. Bun 1.4.0 currently segfaults in the package
          # test process on GitHub Actions; do not follow `latest` across majors.
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test conduit-planet
        run: bun test packages/conduit-planet/tests

      - name: Test simulation time and seasons
        run: bun test tests/SimulationClock.test.ts tests/PlanetSeasonCycle.test.ts

      - name: Build production game bundle
        run: bun ./scripts/build.ts

      # The package currently contains known legacy WebGPU/TSL typing debt and
      # rootDir issues across conduit-web3d. Keep reporting those errors, but do
      # not let pre-existing migration debt block the stabilization test gate.
      - name: Typecheck conduit-planet (advisory)
        continue-on-error: true
        run: bunx tsc -p packages/conduit-planet/tsconfig.json --noEmit
